## Include all packages in the packages directory
homeassistant:
  packages: !include_dir_named packages

## Quality Test Stand REST Commands
rest_command:
    quality_test:
        url: >
            http://quality.local/rr_gcode?gcode=M92%20U8.88%20M569%20P4%20S1%20M584%20U4%20M203%20U200000%20M906%20U2000%20M201%20U2000%20M566%20U200%20M564%20H0%20S0%0AG91%0AG1%20U9999%20F{{ (states('input_number.stepper_rpm') | float * 360) | int }}%20M18
        method: GET
    play_stepper_song:
        url: >
          http://quality.local/rr_gcode?gcode=M98%20P%220:/macros/{{ states('input_select.stepper_song') }}.g%22
        method: GET
    stepper_stop:
        url: >
            http://quality.local/rr_gcode?gcode=M112
        method: GET

## BLE iBeacon Artifact Tracking Sensors
template:
  - sensor:
      - name: "Assembly 01 Location"
        unique_id: assembly_01_location
        state: >
          {% from 'ifcat_tracker.jinja' import resolve_location %}
          {{ resolve_location('01', this.state) | trim }}
        icon: >
          {% from 'ifcat_tracker.jinja' import resolve_icon %}
          {{ resolve_icon(this.state) | trim }}

