# Board: M5Stack M5StickC PLUS2
### DO NOT USE THIS CONFIGURATION FILE DIRECTLY.
### INSTEAD, CREATE A NEW ESPHOME DEVICE AND USE THIS FILE AS 
### AN EXAMPLE OF HOW TO STRUCTURE YOUR CONFIGURATION.

esphome:
  name: assembly-01
  friendly_name: Assembly 01
  includes:
    - madgwick_sensor.h

esp32:
  variant: esp32
  
logger:
  level: WARN
api:
  encryption:
    key: "***********"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Assembly 01 Fallback Hotspot
    password: "***********"

substitutions:
  artifact_id: "01"
  artifact_num: "1"

packages:
  shared_logic: !include 
    file: common/artifact_config.yaml