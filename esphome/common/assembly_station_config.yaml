sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - throttle_average: 10s

  - platform: ble_rssi
    ibeacon_uuid: "c29ce823-e67a-4e71-bff2-abaa32e77a98"
    ibeacon_major: 1
    name: "Assembly 01 RSSI"
    filters: &rssi_filters
      - quantile:          # <-- Tracks the upper envelope (ignores sudden dips from hands/bodies!)
          window_size: 6
          send_every: 1
          send_first_at: 1
          quantile: 0.85
      - exponential_moving_average:
          alpha: 0.60      # Fast response to genuine station transitions
          send_every: 1
      - throttle: 250ms    # Max 4 clean updates/sec to Home Assistant
      - timeout:
          timeout: 15s
          value: -100.0
  - platform: ble_rssi
    ibeacon_uuid: "c29ce823-e67a-4e71-bff2-abaa32e77a98"
    ibeacon_major: 0
    name: "Assembly 00 RSSI"
