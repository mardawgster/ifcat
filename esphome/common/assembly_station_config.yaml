
time:
  - platform: sntp
    id: sntp_time
    servers:
      - ntp.mgmt.lan
    update_interval: 1min

mqtt:
  broker: homeassistant.servers.lan
  discovery: false
  username: mosquitto
  password: ILoveSensors
    
captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 100ms
    window: 70ms
    active: false
    continuous: true

light:
  - platform: neopixelbus
    variant: ws2811
    pin: 33
    num_leds: 7
    type: "RGB"
    name: "Station 2 LED Strip"
    id: strip
  - platform: partition
    name: "LED 1"
    segments: 
      - id: strip
        from: 6
        to: 6 
  - platform: partition
    name: "LED 2"
    segments: 
      - id: strip
        from: 5
        to: 5 
  - platform: partition
    name: "LED 7"
    segments: 
      - id: strip
        from: 0
        to: 0 
  - platform: partition
    name: "LED 6"
    segments: 
      - id: strip
        from: 1
        to: 1 
  - platform: partition
    name: "LED 5"
    segments: 
      - id: strip
        from: 2
        to: 2 
  - platform: partition
    name: "LED 4"
    segments: 
      - id: strip
        from: 3
        to: 3 
  - platform: partition
    name: "LED 3"
    segments: 
      - id: strip
        from: 4
        to: 4 
        
